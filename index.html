<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>역전재판: 숙제 안 한 자의 변론</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="title-screen" class="screen">
  <div class="title-content">
    <div class="title-mark">逆転裁判</div>
    <h1 class="game-title">역전재판</h1>
    <h2 class="game-subtitle">— 숙제 안 한 자의 변론 —</h2>
    <p class="title-tag">학원 강의실 법정에서 진실을 밝혀라</p>
    <button id="start-btn" class="court-btn">법정 입정</button>
    <p class="credit">A Phoenix Wright Parody · 영어학원 에디션</p>
  </div>
  <div class="title-bg"></div>
</div>

<div id="game-screen" class="screen hidden">
  <div id="court-bg">
    <div id="hp-bar-wrap">
      <div class="hp-label">신뢰도</div>
      <div id="hp-bar"><div id="hp-fill"></div></div>
      <div id="hp-text">100 / 100</div>
    </div>

    <div id="scene">
      <div class="char-side left">
        <div id="teacher-sprite" class="sprite teacher">
          <div class="sprite-face" id="teacher-face">😠</div>
          <div class="sprite-name">영어학원 선생님</div>
        </div>
      </div>
      <div class="char-side right">
        <div id="student-sprite" class="sprite student">
          <div class="sprite-face" id="student-face">😅</div>
          <div class="sprite-name">학생 (나)</div>
        </div>
      </div>
    </div>

    <div id="objection-overlay" class="hidden">
      <div id="objection-text">OBJECTION!</div>
    </div>
    <div id="takethat-overlay" class="hidden">
      <div id="takethat-text">이의 있소!</div>
    </div>
    <div id="holdit-overlay" class="hidden">
      <div id="holdit-text">잠깐!</div>
    </div>

    <div id="dialog-box">
      <div id="speaker-name">선생님</div>
      <div id="dialog-text"></div>
      <div id="dialog-next" class="hidden">▼</div>
    </div>

    <div id="choices" class="hidden"></div>

    <div id="evidence-panel" class="hidden">
      <h3>증거 제시</h3>
      <div id="evidence-list"></div>
      <button id="cancel-evidence">취소</button>
    </div>

    <div id="action-bar" class="hidden">
      <button class="action-btn" data-action="argue">이의제기</button>
      <button class="action-btn" data-action="evidence">증거제출</button>
      <button class="action-btn" data-action="admit">자백</button>
    </div>
  </div>
</div>

<div id="verdict-screen" class="screen hidden">
  <div id="verdict-content">
    <h1 id="verdict-title"></h1>
    <p id="verdict-desc"></p>
    <button id="restart-btn" class="court-btn">다시 변론하기</button>
  </div>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
